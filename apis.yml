aid: tejas-networks
name: Tejas Networks
description: >-
  Tejas Networks is an India-based telecommunications networking products company (part of the Tata
  group) that designs and manufactures a wall-to-wall portfolio of wireline and wireless networking
  equipment for telecom carriers, internet service providers, utilities, defense, and governments.
  Its product lines span Radio Access Network (4G/5G RAN), fiber broadband access (FTTx/GPON),
  packet-optical and DWDM/OTN transport (TJ1600), converged broadband (TJ1400), switching and
  routing, mobile packet core, satcom, and Direct-to-Mobile broadcast, all managed through the
  TejNMS (TJ5500) network management system. Tejas exposes an EMS/NMS management API for its
  equipment, but that interface and its product documentation are delivered through a login-gated
  customer documentation library rather than a public developer program; there is no public REST
  API, OpenAPI specification, SDK, or open developer portal at this time. This profile was surfaced
  as a Mayfield portfolio company and enriched from public sources.
